[workspace]
resolver = "3"
members = ["crates/proto", "crates/ptyd", "crates/core", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
treeix-proto = { path = "crates/proto" }
treeix-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Stripping symbols from proc-macro dylibs breaks loading them on macOS 27 (E0463, mis-aligned LINKEDIT)
[profile.release.build-override]
strip = false
