[workspace]
resolver = "3"
members = ["crates/proto", "crates/ptyd", "crates/core", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
treeix-proto = { path = "crates/proto" }
treeix-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Sized for download: whole-program LTO and size-first code. Panics still unwind, so one bad session can't
# take the daemon and every other session down with it
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = "symbols"

# The terminal hot path keeps full speed: parsing PTY output, scrollback, the wire format
[profile.release.package.treeix-ptyd]
opt-level = 3
[profile.release.package.alacritty_terminal]
opt-level = 3
[profile.release.package.vte]
opt-level = 3

# Stripping symbols from proc-macro dylibs breaks loading them on macOS 27 (E0463, mis-aligned LINKEDIT)
[profile.release.build-override]
strip = false
