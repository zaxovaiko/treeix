[package]
name = "treeix-ptyd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "treeix_ptyd"
path = "src/lib.rs"

[[bin]]
name = "treeix-ptyd"
path = "src/main.rs"

[[bin]]
name = "ptyd-bench"
path = "src/bin/ptyd-bench.rs"

# An ACP agent over stdio for the chat tests
[[bin]]
name = "fake-acp-agent"
path = "tests/support/fake_acp_agent.rs"
test = false

[dependencies]
treeix-proto.workspace = true
treeix-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
alacritty_terminal = "0.26"
portable-pty = "0.9"
nix = { version = "0.30", features = ["signal", "process", "term", "user", "fs"] }
libc = "0.2"
zstd = "0.13"
getrandom = "0.3"
agent-client-protocol = "=3.4.0"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
