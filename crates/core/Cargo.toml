[package]
name = "treeix-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
ignore = "=0.4.33"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
trash = "=5.2.9"
notify-debouncer-full = "=0.7.0"
sha1_smol = "=1.0.1"
tokio.workspace = true
rmcp = { version = "=3.6.0", features = ["server", "transport-streamable-http-server"] }
axum = "=0.8.9"
subtle = "=2.6.1"
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", features = ["json"] }
jiff = "0.2"
zstd = "0.13"
treeix-proto = { workspace = true, features = ["specta"] }
croner = { version = "=4.0.2", default-features = false, features = ["jiff"] }
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
oxc_resolver = "=11.24.3"

[dev-dependencies]
tempfile = "3"
