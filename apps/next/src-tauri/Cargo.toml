[package]
name = "treeix-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "treeix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
treeix-proto = { workspace = true, features = ["specta"] }
treeix-core.workspace = true
tauri = { version = "2.12", features = ["devtools", "macos-private-api", "specta", "tray-icon", "unstable"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.9"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
smappservice-rs = "=0.1.3"
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "pwr_mgt"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFString"] }
objc2 = "=0.6.5"
block2 = "=0.6.2"
