appId: com.dyvertex.treeix
productName: Treeix
# The feed the app updates from: the tag's GitHub release, with the latest-mac.yml electron-builder uploads beside the zip
publish:
  provider: github
  owner: zaxovaiko
  repo: treeix
  releaseType: release
directories:
  buildResources: build
# An allowlist: Vite bundles the app into out/, so only that, the runtime dependencies and the native pieces ship.
# A denylist let dist/ and src/ in as soon as node_modules stopped dominating the archive.
files:
  - out/**
  - resources/menuBarGlyph.png
  - native/mac-window/build/Release/*.node
  # The dictation plugin's helper: hotkey, microphone, speech recognition and pasting (native/voice)
  - native/voice/bin/treeix-voice
  - node_modules/**
  - package.json
  # node-pty ships a 14MB prebuild per platform and only ever loads its own. Packaging for Windows needs this revisited.
  - '!node_modules/node-pty/prebuilds/{darwin-x64,win32-arm64,win32-x64}/**'
  - '!node_modules/node-pty/{src,deps,third_party,scripts}/**'
  # Headers for compiling native modules; node-pty ships prebuilt and never loads it
  - '!node_modules/node-addon-api/**'
  # The language service only calls the typescript API and its lib.*.d.ts files; the CLI compiler, tsserver and the
  # translated diagnostics are two thirds of the package and are never loaded.
  - '!node_modules/typescript/lib/{_tsc.js,_tsserver.js,_typingsInstaller.js,tsc.js,tsserver.js,tsserverlibrary.js,typingsInstaller.js,watchGuard.js}'
  - '!node_modules/typescript/lib/{typescript.d.ts,tsserverlibrary.d.ts}'
  - '!node_modules/typescript/lib/{cs,de,es,fr,it,ja,ko,pl,pt-br,ru,tr,zh-cn,zh-tw}/**'
  - '!node_modules/typescript/bin/**'
asarUnpack:
  - node_modules/node-pty/**
  - native/mac-window/build/Release/*.node
  - native/voice/bin/treeix-voice
mac:
  # 220 locale bundles ship by default and the app has no translations; English alone saves ~50MB before compression
  electronLanguages:
    - en
  # Icon Composer file: macOS 26 puts legacy .icns icons on a grey plate; build/icon.icns stays for older macOS
  icon: build/icon.icon
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.developer-tools
  # A map: a list here lands in Info.plist as keys "0", "1", ... that macOS never reads
  extendInfo:
    NSDocumentsFolderUsageDescription: Treeix scans your Documents folder for git repositories.
    NSDownloadsFolderUsageDescription: Treeix scans your Downloads folder for git repositories.
    NSMicrophoneUsageDescription: Treeix listens while you hold the dictation key and turns your speech into text on this Mac.
    # Open With > Treeix for any text file, as an alternative that never takes over the default app.
    # .ts and .mts are typed as MPEG-2 video by macOS, so source extensions are listed by name too.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Text
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes: [public.text, public.source-code, public.script, public.json, public.xml, public.yaml]
      - CFBundleTypeName: Source code
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        CFBundleTypeExtensions:
          [
            ts,
            tsx,
            mts,
            cts,
            js,
            jsx,
            mjs,
            cjs,
            json,
            jsonc,
            md,
            mdx,
            txt,
            css,
            scss,
            html,
            vue,
            svelte,
            yml,
            yaml,
            toml,
            ini,
            env,
            sh,
            zsh,
            py,
            rb,
            go,
            rs,
            java,
            kt,
            swift,
            c,
            h,
            cpp,
            hpp,
            cs,
            php,
            sql,
            graphql,
            xml,
            csv,
            log,
            lock
          ]
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # Notarizes only when APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are set
dmg:
  artifactName: ${productName}-${arch}.${ext}
  # ULFO is lzfse; UDZO, the default, is zlib. Needs macOS 10.11+, and the app asks for 14.
  format: ULFO
mas:
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  # Download from developer.apple.com (Mac App Store distribution profile for com.dyvertex.treeix)
  provisioningProfile: build/embedded.provisionprofile
  # Watching keys in other apps and pasting into them can't work in the sandbox
  files:
    - '!native/voice/**'
npmRebuild: false
