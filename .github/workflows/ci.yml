name: CI

# The Rust crates, the Tauri app (apps/desktop) and its frontend
on:
  pull_request:
    paths: &paths ['crates/**', 'apps/desktop/**', 'Cargo.*', 'rust-toolchain.toml', 'bench/**', '.github/workflows/ci.yml']
  push:
    paths: *paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml: the pinned channel with clippy and rustfmt
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Tauri's Linux prerequisites (WebKitGTK 4.1, GTK, appindicator, rsvg, xdo for the global shortcut)
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # tauri-build checks that the externalBin sidecars and the frontend dist exist; tests need neither for real
      - name: Sidecar placeholders
        run: |
          mkdir -p apps/desktop/src-tauri/binaries apps/desktop/dist
          for name in treeix-ptyd treeix-voice; do touch "apps/desktop/src-tauri/binaries/$name-$(rustc --print host-tuple)"; done

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The test run regenerates apps/desktop/src/ipc/bindings.ts; a diff means the commit carries stale bindings
      - if: runner.os == 'macOS'
        run: git diff --exit-code apps/desktop/src/ipc/bindings.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bunx tsc --noEmit -p e2e
      - run: bun test src
      - run: bun test ../../bench

      - run: bunx playwright install --with-deps webkit chromium

      # Headless WebKit (the engine of WKWebView) and Chromium against the dev server on the mock daemon
      - run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  perf:
    runs-on: macos-latest
    env:
      BASELINE: bench/baseline/macos-latest.json
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: bun bench/gen.ts

      - run: cargo build --release -p treeix-ptyd --bin ptyd-bench

      - name: ptyd-bench
        run: |
          target/release/ptyd-bench --in-process /tmp/treeix-bench/mixed-100m.ans > "$RUNNER_TEMP/ptyd-bench.json"
          cat "$RUNNER_TEMP/ptyd-bench.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ptyd-bench-macos-latest
          path: ${{ runner.temp }}/ptyd-bench.json

      # Fails on a > 10% regression. No baseline yet: commit a run's artifact as bench/baseline/macos-latest.json
      - name: Compare with the baseline
        run: |
          if [ -f "$BASELINE" ]; then
            bun bench/compare.ts "$BASELINE" "$RUNNER_TEMP/ptyd-bench.json"
          else
            echo "No $BASELINE, nothing to compare"
          fi
