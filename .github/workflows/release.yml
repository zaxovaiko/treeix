name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    # macos-14 and later are Apple silicon, which is what the DMG targets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(bun --print "require('./apps/desktop/package.json').version")
          test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME does not match apps/desktop/package.json $version"; exit 1; }

      - run: bun install

      - run: bun run typecheck
      - run: bun test

      - name: Build the DMG
        run: bun run dist:dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            apps/desktop/dist/Treeix-arm64.dmg \
            apps/desktop/dist/Treeix-*-arm64-mac.zip
