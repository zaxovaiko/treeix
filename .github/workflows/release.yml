name: Release

# Every push to main that touches the app ships a release. The tag is created by the release itself,
# so tags don't trigger this workflow, and pushes made with GITHUB_TOKEN never trigger workflows at all
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '!**.md']

permissions:
  contents: write

# Queued, never cancelled: each run has to see the tag the previous one created
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The frontend build (Monaco, Shiki grammars, Mermaid) needs more heap than Node's default
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Picks the version and opens the release as a draft; the builds upload into it and `publish` makes it public
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A version set by hand in package.json above the latest tag (a minor) ships as is; a lower one is ignored.
      # Otherwise a breaking commit since the latest tag (feat!:, BREAKING CHANGE:) ships the next major, and anything
      # else the patch after the latest tag. The bump lives only in this build, main is never committed to
      - name: Pick the version and write the notes
        id: pick
        run: |
          pinned=$(jq -r .version apps/desktop/package.json)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          notes="$RUNNER_TEMP/notes.md"
          sh apps/desktop/scripts/release-notes.sh "${latest:+$latest..}HEAD" > "$notes"
          IFS=. read -r major minor patch <<< "${latest#v}"
          if [ -z "$(git tag -l "v$pinned")" ] && [ "$(printf '%s\n' "${latest#v}" "$pinned" | sort -V | tail -1)" = "$pinned" ]; then
            version="$pinned"
          elif grep -q '^## Breaking' "$notes"; then
            version="$((major + 1)).0.0"
          else
            version="$major.$minor.$((patch + 1))"
          fi
          [ -n "$latest" ] && echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$latest...v$version" >> "$notes"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"
          cat "$notes"

      # A draft until every file is up: installed copies see the release only once latest.json is there.
      # The tag is created on this commit when the draft is published. A draft left by a failed run is moved to this commit
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # One universal app (Apple silicon and Intel), signed, notarized and stapled, as Treeix.dmg and the updater bundle
  macos:
    needs: version
    runs-on: macos-26
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: universal-apple-darwin
    outputs:
      sig: ${{ steps.upload.outputs.sig }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Rust for both architectures
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Saved even when a later step fails, so a broken run still warms the next one
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # tauri.conf.json takes its version from package.json; the bump lives only in this build
      - run: npm version --no-git-tag-version --allow-same-version --prefix apps/desktop "${TAG#v}" > /dev/null

      - run: bun install --frozen-lockfile
        working-directory: apps/desktop

      # The dictation and meetings helpers (Swift, FluidAudio). A cold universal build takes minutes, so the
      # binaries are reused until the Swift sources change. Saved right after the build, so a later failure keeps them
      - uses: actions/cache/restore@v4
        id: voice
        with:
          path: |
            apps/desktop/src-tauri/binaries/treeix-voice-universal-apple-darwin
            apps/desktop/src-tauri/binaries/treeix-meetings-universal-apple-darwin
          key: voice-${{ hashFiles('apps/desktop/native/voice/Package.*', 'apps/desktop/native/voice/Sources/**') }}
      - if: steps.voice.outputs.cache-hit != 'true'
        run: sh apps/desktop/scripts/build-voice.sh release
      - if: steps.voice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/desktop/src-tauri/binaries/treeix-voice-universal-apple-darwin
            apps/desktop/src-tauri/binaries/treeix-meetings-universal-apple-darwin
          key: ${{ steps.voice.outputs.cache-primary-key }}

      # tauri bundles externalBin as binaries/<name>-<target>; build-ptyd.sh builds the host arch only, and a
      # universal app takes one fat binary. Reused until the Rust crates it builds from change
      - uses: actions/cache/restore@v4
        id: ptyd
        with:
          path: apps/desktop/src-tauri/binaries/treeix-ptyd-universal-apple-darwin
          key: ptyd-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**') }}
      - name: Universal treeix-ptyd sidecar
        if: steps.ptyd.outputs.cache-hit != 'true'
        run: |
          for arch in aarch64 x86_64; do cargo build --release -p treeix-ptyd --bin treeix-ptyd --target "$arch-apple-darwin"; done
          lipo -create -output "apps/desktop/src-tauri/binaries/treeix-ptyd-$TARGET" \
            target/aarch64-apple-darwin/release/treeix-ptyd target/x86_64-apple-darwin/release/treeix-ptyd
      - if: steps.ptyd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/desktop/src-tauri/binaries/treeix-ptyd-universal-apple-darwin
          key: ${{ steps.ptyd.outputs.cache-primary-key }}

      # Each per-arch compile of the universal build checks for its own <name>-<arch> file
      - name: Per-arch sidecar names
        working-directory: apps/desktop/src-tauri/binaries
        run: |
          for name in treeix-ptyd treeix-voice treeix-meetings; do
            for arch in aarch64 x86_64; do cp "$name-$TARGET" "$name-$arch-apple-darwin"; done
          done

      # Tauri signs with APPLE_SIGNING_IDENTITY and notarizes with the API key (its APPLE_API_KEY is the key id,
      # APPLE_API_KEY_PATH the .p8)
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one argument per keychain already in the search list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          rm -f "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "No Developer ID Application identity in MAC_CERT_P12"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      # The sidecars are already built, so only the frontend is. Tauri signs the app and every sidecar with the
      # hardened runtime and Entitlements.plist, notarizes and staples the app, then makes the DMG and the
      # minisign-signed updater bundle (Treeix.app.tar.gz and its .sig)
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target "$TARGET" --config '{"build":{"beforeBuildCommand":"bun run build"},"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify the signatures
        run: |
          app="target/$TARGET/release/bundle/macos/Treeix.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in "$app/Contents/MacOS/"*; do
            codesign -d --verbose=2 "$binary" 2>&1 | grep -q 'flags=.*runtime' || { echo "$binary lacks the hardened runtime"; exit 1; }
          done
          xcrun stapler validate "$app"

      - name: Notarize the DMG
        run: |
          dmg=$(ls "target/$TARGET/release/bundle/dmg/"*.dmg)
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          rm -f "$APPLE_API_KEY_PATH"

      # Treeix.dmg is what the landing page's /download points at (vercel.json)
      - name: Upload to the draft
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target/${{ env.TARGET }}/release/bundle
        run: |
          cp dmg/*.dmg "$RUNNER_TEMP/Treeix.dmg"
          gh release upload "$TAG" --clobber "$RUNNER_TEMP/Treeix.dmg" macos/Treeix.app.tar.gz macos/Treeix.app.tar.gz.sig
          echo "sig=$(cat macos/Treeix.app.tar.gz.sig)" >> "$GITHUB_OUTPUT"

  # The AppImage is also its own update: the updater swaps the file in place
  appimage:
    needs: version
    # The oldest glibc the AppImage runs on is the one it was built against
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    outputs:
      sig: ${{ steps.upload.outputs.sig }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: rustup toolchain install

      # Saved even when a later step fails, so a broken run still warms the next one
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Tauri's Linux prerequisites (WebKitGTK 4.1, GTK, appindicator, rsvg, xdo for the global shortcut), patchelf for the AppImage
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm version --no-git-tag-version --allow-same-version --prefix apps/desktop "${TAG#v}" > /dev/null

      - run: bun install --frozen-lockfile
        working-directory: apps/desktop

      # beforeBuildCommand builds treeix-ptyd for this host and skips the Swift helpers off macOS;
      # tauri.linux.conf.json makes the bundle an AppImage
      - name: Build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Upload to the draft
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target/release/bundle/appimage
        run: |
          cp Treeix_*.AppImage "$RUNNER_TEMP/Treeix-x86_64.AppImage"
          cp Treeix_*.AppImage.sig "$RUNNER_TEMP/Treeix-x86_64.AppImage.sig"
          gh release upload "$TAG" --clobber "$RUNNER_TEMP/Treeix-x86_64.AppImage" "$RUNNER_TEMP/Treeix-x86_64.AppImage.sig"
          echo "sig=$(cat "$RUNNER_TEMP/Treeix-x86_64.AppImage.sig")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [version, macos, appimage]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      MAC_SIG: ${{ needs.macos.outputs.sig }}
      LINUX_SIG: ${{ needs.appimage.outputs.sig }}
    steps:
      # The feed tauri-plugin-updater reads from releases/latest/download/latest.json. The universal app serves
      # both Mac architectures
      - name: Upload latest.json
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          jq -n --arg version "${TAG#v}" --rawfile notes "$RUNNER_TEMP/notes.md" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$base/Treeix.app.tar.gz" --arg mac_sig "$MAC_SIG" \
            --arg linux "$base/Treeix-x86_64.AppImage" --arg linux_sig "$LINUX_SIG" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac, signature: $mac_sig},
              "darwin-x86_64": {url: $mac, signature: $mac_sig},
              "linux-x86_64": {url: $linux, signature: $linux_sig}
            }}' > "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" --clobber "$RUNNER_TEMP/latest.json"

      - run: gh release edit "$TAG" --draft=false --latest
