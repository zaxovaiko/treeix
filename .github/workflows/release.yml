name: Release

# Every push to main that touches the app ships a patch release. The tag is created by the release itself,
# so tags don't trigger this workflow, and pushes made with GITHUB_TOKEN never trigger workflows at all
on:
  push:
    branches: [main]
    paths-ignore: ['apps/landing/**', 'docs/**', 'marketing/**', '.claude/**', '**.md']

permissions:
  contents: write

# Queued, never cancelled: each run has to see the tag the previous one created
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Picks the version and opens the release as a draft; the builds upload into it and `publish` makes it public
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # A version bumped by hand in package.json (a minor) ships as is; a breaking commit since the latest tag
      # (feat!:, BREAKING CHANGE:) ships the next major; otherwise the patch after the latest tag. The bump lives
      # only in this build, main is never committed to
      - name: Pick the version and write the notes
        id: pick
        run: |
          pinned=$(bun --print "require('./apps/desktop/package.json').version")
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          notes="$RUNNER_TEMP/notes.md"
          sh apps/desktop/scripts/release-notes.sh "${latest:+$latest..}HEAD" > "$notes"
          IFS=. read -r major minor patch <<< "${latest#v}"
          if [ -z "$(git tag -l "v$pinned")" ]; then
            version="$pinned"
          elif grep -q '^## Breaking' "$notes"; then
            version="$((major + 1)).0.0"
          else
            version="$major.$minor.$((patch + 1))"
          fi
          [ -n "$latest" ] && echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$latest...v$version" >> "$notes"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"
          cat "$notes"

      # A draft until every file is up: installed copies see the release only once latest-mac.yml and
      # latest-linux.yml are there. The tag is created on this commit when the draft is published
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  dmg:
    needs: version
    # Apple silicon, which is what the DMG targets, and Xcode 26 for the Icon Composer icon actool 15 cannot read
    runs-on: macos-26
    # The renderer build (Monaco, Shiki grammars, Mermaid) peaks around 2.4 GB of heap, past Node's default on this runner
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The bump lives only in this build, main is never committed to
      - run: npm version --no-git-tag-version --prefix apps/desktop "${TAG#v}" > /dev/null

      - run: bun install

      - run: bun run typecheck
      - run: bun test

      # The dictation helper, a Swift binary shipped unpacked beside the asar
      - run: bun run --cwd apps/desktop build:voice

      # Signed builds are the ones the app can update itself into: macOS only replaces a build whose
      # Developer ID signature matches. Without the secrets this still ships a DMG, just one people install by hand.
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      # electron-builder's own CSC_LINK import is broken: it creates the keychain with one password and then
      # unlocks it with the certificate's (macCodeSign.js, set-key-partition-list), so the import always fails.
      # Importing here and letting it discover the identity avoids that entirely.
      - name: Import the signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      # An empty APPLE_API_KEY is what tells electron-builder to skip notarization. Only the signed build takes the
      # passkey entitlement and its provisioning profile: macOS kills an ad-hoc build that claims it at launch.
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY: ${{ steps.signing.outputs.signed == 'true' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          script=release:mac
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY"
            script=dist:dmg:notarized
          fi
          bun run --cwd apps/desktop "$script"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # electron-builder's own uploader quits before the uploads finish when it runs under bun, leaving a
      # release with a stray blockmap, so the assets go up here. latest-mac.yml is the update feed itself.
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/dist
        run: |
          gh release upload "$TAG" --clobber \
            Treeix-arm64.dmg Treeix-arm64.dmg.blockmap \
            Treeix-*-arm64-mac.zip Treeix-*-arm64-mac.zip.blockmap \
            latest-mac.yml

  appimage:
    needs: version
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: npm version --no-git-tag-version --prefix apps/desktop "${TAG#v}" > /dev/null

      # Compiles node-pty, which ships no Linux prebuild (scripts/postinstall.sh)
      - run: bun install

      - run: bun run typecheck
      - run: bun test

      # The AppImage updates itself from latest-linux.yml
      - run: bun run --cwd apps/desktop release:linux

      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/dist
        run: gh release upload "$TAG" --clobber Treeix-*.AppImage latest-linux.yml

  publish:
    needs: [version, dmg, appimage]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
