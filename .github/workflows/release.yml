name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    # Apple silicon, which is what the DMG targets, and Xcode 26 for the Icon Composer icon actool 15 cannot read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(bun --print "require('./apps/desktop/package.json').version")
          test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME does not match apps/desktop/package.json $version"; exit 1; }

      - run: bun install

      - run: bun run typecheck
      - run: bun test

      # Signed builds are the ones the app can update itself into: macOS only replaces a build whose
      # Developer ID signature matches. Without the secrets this still ships a DMG, just one people install by hand.
      - name: Check for signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      # electron-builder's own CSC_LINK import is broken: it creates the keychain with one password and then
      # unlocks it with the certificate's (macCodeSign.js, set-key-partition-list), so the import always fails.
      # Importing here and letting it discover the identity avoids that entirely.
      - name: Import the signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, notarize and publish
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          bun run --cwd apps/desktop release:mac
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build the DMG unsigned
        if: steps.signing.outputs.signed != 'true'
        run: bun run dist:dmg

      - name: Publish the unsigned release
        if: steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            apps/desktop/dist/Treeix-arm64.dmg \
            apps/desktop/dist/Treeix-*-arm64-mac.zip
